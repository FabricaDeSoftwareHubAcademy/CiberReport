<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER REPORT</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="cabecalho-modal-cadastro-projeto">
        <div class="conteudo-modal-cadastro-projeto">
            <i class="icone-projeto">

            </i>
            <div class="info-modal-cadastro-projeto">
                <h1 class="titulo-modal-cadastro-projeto">
                    Cadastro de Projeto
                </h1>
                <span class="subtitulo-modal-cadastro-projeto">
                    Informações da empresa contratante e do projeto
                </span>
            </div>
            <i class="fechar-modal-cadastro-projeto"><img src="../itens/x.svg" alt=""></i>
        </div>
    </div>
    <div class="stepper-container">
        <div class="step-indicator" id="step-1">
            <span class="step-number">1</span>
            <span class="step-text">
                Cadastro
            </span>
        </div>
        <div class="line-space-step"></div>
        <div class="step-indicator" id="step-2">
            <span class="step-number">2</span>
            <span class="step-text">
                Dados do Projeto
            </span>
        </div>
        <div class="line-space-step"></div>
        <div class="step-indicator" id="step-3">
            <span class="step-number">3</span>
            <span class="step-text">
                Alocar Equipe
            </span>
        </div>
        <div class="line-space-step"></div>
        <div class="step-indicator" id="step-4">
            <span class="step-number">4</span>
            <span class="step-text">
                Revisão
            </span>
        </div>
    </div>
    <form class="conteudo-modal-cadastro-projeto">
        <section class="informacoes-cliente-projeto">
            <i class="icone-cliente-projetos"></i>
            <span class="titulo-secao-cliente">
                Informações do Cliente
            </span>
            <div class="input-cliente-projeto">
                <div class="select-cliente">
                    <label for="select-cliente-projeto">Cliente</label>
                    <input type="text" name="select-cliente-projeto" id="select-cliente-projeto" placeholder="Selecione um cliente">
                    <i class="drop-down-cliente"><img src="../icones/chevron-down.svg" alt=""></i>
                </div>
                <i class="adicionar-cliente"><img src="../icones/square-plus.svg" alt=""></i>
                <div class="input-nome-projeto">
                    <label for="nome-projeto">Nome do Projeto</label>
                    <input type="text" name="nome-projeto" id="nome-projeto" placeholder="Ex: Pentest WEB - Gazin">
                </div>
            </div>
        </section>
        <section class="informacoes-pentest">
            i.
        </section>
    </form>
    
</body>

</html>
