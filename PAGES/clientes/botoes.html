<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botoes</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="botoes.css">
    <link rel="stylesheet" href="../../src/styles/style.css">
</head>
<body>
    <div class="btn-botoes-container">
        <div class="grupo-botoes">
            <!-- Tela Gerenciamento de Clientes -->
            <button class="btn-salvar">Salvar</button>
            <button class="btn-cancelar">Cancelar</button>
            <button class="btn-novo-cadastro"><i class="fa-solid fa-plus"></i>Novo Cadastro</button>
            <button class="btn-fechar-modal"><i class="fa-solid fa-xmark"></i></button>
            <button class="btn-editar"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="btn-excluir"><i class="fa-solid fa-trash"></i></button>
            <button class="btn-filtro"><i class="fa-solid fa-filter filter-icon"></i></button>
        </div>

        <div class="grupo-botoes">
            <!-- Tela Banco de Conhecimento -->
            <button class="btn-ver-todas">ver todas</button>
            <button class="btn-ver-completo">ver completo</button>
            <button class="btn-ver-tudo">ver tudo</button>
            <button class="btn-descricao-detalhada">descrição detalhada</button>
        </div>
        <div class="grupo-botões">
            <!-- Tela de Notificação -->
            <button class="btn-notificacao-todas">Todas as Notificações</button>
            <button class="btn-notificacao-lida">Notificações Lidas</button>
            <button class="btn-notificacao-nao-lida">Notificações não Lidas</button>
            <button class="btn-ver-todas">ver todas</button>
            <button class="btn-dropdown"><i class="fa-solid fa-angle-down"></i></button>
            <!-- Tela de Vulnerabilidades -->
            <!-- Modais de Confirmação -->
            <!-- Confirmar inativação -->
            <button class="btn-conf-nao-inativacao">Não,voltar</button>
            <button class="btn-conf-sim-inativacao">Sim,inativar</button>
            <!-- Confirmar Reativação -->
            <button class="btn-conf-sim-reativacao">Sim,reativar</button>
            <!-- Para o card de exclusão tela de gerenciar usuarios -->
            <button class="btn-confirmar-exclusao-sim">Sim,excluir</button>
            <!-- Para o card de confirmar salvamento -->
            <button class="btn-confirmar-sim">Sim,salvar</button>

            <!-- Gerar usuarios -->
            <button class="btn-alterar-foto">Alterar Foto</button>
            

            <!-- Tela Gerenciar Perfis -->
            <button class="btn-perfil-administrador">Administrador</button>
            <button class="btn-perfil-analista">Analista</button>
            <button class="btn-perfil-cliente">Cliente</button>

            <!-- Tela Gerenciar Checklist -->
            <button class="btn-adicionar-pergunta"><i class="fa-solid fa-plus"></i>Adicionar Pergunta</button>

            <!-- Tela Gerenciamento de Pentest -->
            <button class="btn-avancar">Avançar<i class="fa-solid fa-arrow-right"></i></i></button>
            <button class="btn-voltar"><i class="fa-solid fa-arrow-left"></i></i>Voltar</button>
            <button class="btn-adicionar-quadrado">
                <span class="icone-azul"><i class="fa-solid fa-plus"></i></span>
            </button>

            <!-- Gerenciar Projetos -->
            <button class="btn-fechar-modal-projeto">Fechar</button>
            <button class="btn-projeto-horas">Horas</button>
            <button class="btn-projeto-vulnerabilidade">Vulnerabilidade</button>
            <button class="btn-projeto-equipe">Equipe</button>
            <button class="btn-projeto-equipe">Checklist</button>
            <button class="btn-projeto-log-atividade">Log de Atividades</button>

            <button class="btn-projeto-baixar">Baixar</button>

            <button class="btn-remover-analista"><i class="fa-solid fa-xmark"></i></button>
            <button class="btn-projeto-devolver">Devolver</button>
            <button class="btn-projeto-aprovar">Aprovar</button>

            <button class="btn-upload-projeto">Selecionar Arquivo</button>


            <button class="btn-filtro-redefinir">Redefinir</button>
            <button class="btn-filter-coluna">Aplicar Filtro</button>
            <!-- Tela de Exposição de vulnerabilidades -->
            <button class="btn-vulnerabilidade-critica">Critico</button>
            <button class="btn-vulnerabilidade-alta">Alta</button>
            <button class="btn-vulnerabilidade-media">Média</button>
            <button class="btn-volnerabilidade-baixa">Baixa</button>

            <!-- Tela de Dashboard e Testes -->
            <button type=".btn-upload-dashboard">Upload</button>
            <button class="btn-remover">Remover</button>
            <button class="btn-visualizar-relatorio">Ver Relatório</button>

            <!-- Tela de Login -->
            <button class="btn-login">Login</button>
            <button class="btn-esqueceu-senha">Forgot Password?</button>
            <button class="btn-visualizar-senha"></button>
            <!-- Botão de ativo e inativo e botão checklist -->
            <!-- Botão de checklist -->

            <!-- Opção de Botão para cadastro -->
            <button class="btn-cadastrar-checklist">
                <span class="icon-plus"><i class="fa-solid fa-plus"></i></span>
                Cadastrar Checklist
            </button>

            <div class="btn-container">
            <div class="toggle-component">
                <input type="checkbox" id="switch-1" class="toggle-input">
                <label for="switch-1" class="btn-button">
                <span class="circulo-switch"></span>
                </label>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
