<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideBar</title>
    <!-- scripts -->
    <script src="../JAVASCRIPT/menu.js" defer></script>
    <!-- links -->
    <link rel="stylesheet" href="../CSS/reset.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/menuSuperior.css">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-ref  errer" />
</head>

<body>
    <nav id="sideBar">
        <div class="sidebar_content">
            <div class="logo">
                <div class="logo-nome">
                    <img src="../IMG/image-removebg-preview.svg" alt="">
                    <img src="../IMG/Logo Baikal.svg" alt="">
                </div>
                <div class="logo-imagem">
                    <img src="../IMG/Logo Baikal-1.svg" alt="">
                </div>

            </div>
            <ul id="side_itens">
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-chart-column"></i>
                        <span class="item_description">Dashboard</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-file-lines"></i>
                        <span class="item_description">Relatórios</span>
                    </a>
                </li>
                <li class="side_item pai-subMenu">
                    <a href="#" class="side_item">
                        <i class="fa-solid fa-building-user"></i>
                        <span class="item_description">Gestão</span>
                        <i class="fa-solid fa-chevron-down dropdown"></i>
                    </a>
                    <ul class="submenu">
                        <li class="side_item">
                            <a href="#">
                                <i class="fa-solid fa-users"></i>
                                <span class="item_description">Usuários</span>
                            </a>
                        </li>
                        <li class="side_item">
                            <a href="#">
                                <i class="fa-solid fa-address-book"></i>
                                <span class="item_description">Clientes</span>
                            </a>
                        </li>
                        <li class="side_item">
                            <a href="#">
                                <i class="fa-solid fa-terminal"></i>
                                <span class="item_description">Projetos</span>
                            </a>
                        </li>
                        <li class="side_item active">
                            <a href="#">
                                <i class="fa-solid fa-user-secret"></i>
                                <span class="item_description">Pentest</span>
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span class="item_description">Checklist</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-list-check"></i>
                        <span class="item_description">Vulnerabilidades</span>
                    </a>
                </li>
                <!-- <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-list-check"></i>
                        <span class="item_description">Log</span>
                    </a>
                </li> -->
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-book-open"></i>
                        <span class="item_description">Banco de <br> Conhecimento</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-gear"></i>
                        <span class="item_description">Perfis de acesso</span>
                    </a>
                </li>
            </ul>
            <button id="open_btn">
                <i class="fa-solid fa-chevron-right" id="open_btn_icon"></i>
            </button>
        </div>
        <div id="logout">
            <button id="logout_btn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="item_description">
                    Logout
                </span>
            </button>
        </div>
    </nav>

    <div class="main-content">
        <header id="menu-superior">
            <h1>Titulo da pagina</h1>
            <div class="input-container">
                <button>
                    <i class="fa-brands fa-sistrix"></i>
                </button>
                <input type="text" placeholder="">
            </div>

            <div class="perfis">
                <i class="fa-regular fa-bell"></i>
                <img class="imagem-usuario" src="../IMG/fotoDePerfil.jpg" alt="">
                <div class="description-user">
                    <p>Marcos antonio</p>
                    <p>Gerente</p>
                </div>
            </div>
        </header>

        <main>
            <h2>Conteúdo Principal</h2>
        </main>
    </div>
</body>

</html>
