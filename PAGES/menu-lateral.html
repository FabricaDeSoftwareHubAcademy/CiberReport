<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideBar</title>
    <!-- scripts -->
    <script src="../JAVASCRIPT/menu.js" defer></script>
    <!-- links -->
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav id="sideBar">
        <div class="sidebar_content">
            <div class="logo">
                <div class="logo-imagem">
                    <img src="../IMG/Logo Baikal-1.svg" alt="">
                </div>
                <div class="logo-nome">
                    <img src="../IMG/image-removebg-preview.svg" alt="">
                </div>
                <div class="logo-security">
                    <img src="../IMG/Logo Baikal.svg" alt="">
                </div>
            </div>
            <ul id="side_itens">
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-gauge"></i>
                        <span class="item_description">Dashboard</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-user-secret"></i>
                        <span class="item_description">Pentest</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-list-check"></i>
                        <span class="item_description">Vulnerabilidades</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-file-lines"></i>
                        <span class="item_description">Relatórios</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-briefcase"></i>
                        <span class="item_description">Gestão</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-address-book"></i>
                        <span class="item_description">Clientes</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-users"></i>
                        <span class="item_description">Usuários</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-book-open"></i>
                        <span class="item_description">Banco de Conhecimento</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-terminal"></i>
                        <span class="item_description">Log</span>
                    </a>
                </li>
                <li class="side_item">
                    <a href="#">
                        <i class="fa-solid fa-gear"></i>
                        <span class="item_description">Configurações</span>
                    </a>
                </li>
            </ul>
            <button id="open_btn">
                <i class="fa-solid fa-chevron-right" class="open_btn_icon"></i>
                <span class="item-description">
                    Logout
                </span>
            </button>
        </div>
    </nav>
    <main>
        <P>TEXO</P>
    </main>
</body>
</html>
