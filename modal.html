<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER REPORT</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <div class="modal">
        <div class="box">
            <a href="#" class="fechar">x</a>
            <div class="area-titulo">
                <div class="titulo-modal">
                    <h2>Dados da Vulnerabilidade</h2>
                    <label for="">Informação da vulnerabilidade encontrada.</label>
                </div>
            </div>
            <div class="area-dados-vulnerabilidade">
                <div class="input-dados">
                    <label for="">Nome da Vulnerabilidade:</label>
                    <input type="text" name="" id="" placeholder="Ex: SQL Injection">
                </div>
                <div class="input-dados">
                    <label for="">CVSS Score:</label>
                    <input type="text" name="" id="" placeholder="0.0 - 10.0">
                </div>
                <div class="input-dados">
                    <label for="">CVE:</label>
                    <input type="text" name="" id="" placeholder="0.0 - 10.0">
                </div>
                <div class="input-dados">
                    <label for="">Descrição:</label>
                    <input type="text" name="" id="" placeholder="Descreva a Vulnerabilidade">
                </div>
                <div class="input-dados">
                    <label for="">Descrição Técnica:</label>
                    <input type="text" name="" id="" placeholder="Descreva a vulnerabilidade em detalhes">
                </div>
                <div class="input-dados">
                    <label for="">Impactos:</label>
                    <input type="text" name="" id="" placeholder="Descreva o impacto potencial">
                </div>
                <div class="input-dados">
                    <label for="">Responsável:</label>
                    <input type="text" name="" id="" placeholder="Nome do Responsável">
                </div>
                <div class="input-dados">
                    <label for="">Severidade:</label>
                    <input type="text" name="" id="" placeholder="Selecione a severidade">
                </div>
                <div class="input-dados">
                    <label for="">Categoria:</label>
                    <input type="text" name="" id="" placeholder="Selecione a categoria">
                </div>
                <div class="input-dados">
                    <label for="">Status:</label>
                    <input type="text" name="" id="" placeholder="Selecione a status">
                </div>
            </div>
            <div class="botoes-forms">
                <button>CANCELAR</button>
                <button>SALVAR</button>
            </div>
        </div>
    </div>
    
</body>
</html>
