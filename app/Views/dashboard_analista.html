<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Analista</title>
  <link rel="stylesheet" href="../assets/CSS/Pages/dashboard_analista.css">
  <link rel="stylesheet" href="../assets/CSS/reset.css">
  <link rel="stylesheet" href="../assets/CSS/style.css">
  <link rel="stylesheet" href="../assets/CSS/Componentes/cards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <main class="conteudo">

    <div class="topo">
      <h1 class="titulo">Dashboard Analista</h1>
      <div class="busca">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Buscar">
      </div>

      <div class="perfil">
        <button class="sino">
          <i class="fa-solid fa-bell"></i>
        </button>
        <img class="foto-perfil-analista" src="../assets/img/foto-perfil.jpg" alt="">
        <div class="perfil-texto">
          <span class="nome">Bruno</span>
          <span class="cargo">Analista</span>
        </div>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <span class="card-label">Projetos Alocados 2026</span>
        <span class="card-valor">0</span>
      </div>
      <div class="card">
        <span class="card-label">Total em Andamento</span>
        <span class="card-valor">0</span>
      </div>
      <div class="card">
        <span class="card-label">PLACEHOLDER</span>
        <span class="card-valor">0</span>
      </div>
      <div class="card">
        <span class="card-label">Total Concluídos</span>
        <span class="card-valor">0</span>
      </div>
    </div>

    <div class="graficos">
      <div class="grafico-box">
        <div class="grafico-topo">
          <span>Resultado dos Últimos Testes</span>
          <button class="filtro">Filtro</button>
        </div>
        <div class="grafico-vazio"></div>
      </div>

      <div class="grafico-box">
        <div class="grafico-vazio"></div>
        <div class="legenda">
          <span class="tag tag-critica">CRÍTICA</span>
          <span class="tag tag-alta">ALTA</span>
          <span class="tag tag-media">MÉDIA</span>
          <span class="tag tag-baixa">BAIXA</span>
        </div>
      </div>
    </div>
    </div>
  </main>
</body>
</html>
