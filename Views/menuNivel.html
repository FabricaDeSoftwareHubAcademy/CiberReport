<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../assets/CSS/Componentes/menuNIvel.css" />
        <script src="../assets/JS/componentes/menuNIvel.js" defer></script>
        <title>Document</title>
    </head>

    <body>
        <form action="#" class="form">
            <h1 class="titulo">Registro de Formulário</h1>
            <!-- Barra de Progressão -->
                <div class="progressbar">
                    <div class="progress" id="progress"></div>
                    <div class="progress-step progress-step-active" data-title="Intro"></div>
                    <div class="progress-step" data-title="Contact"></div>
                    <div class="progress-step" data-title="ID"></div>
                    <div class="progress-step" data-title="Password"></div>
                </div>
            <!-- Steps -->
            <div class="form-step form-step-active">
                <div class="input-group">
                    <label for="username">username</label>
                    <input type="text"
                           id="username"
                           placeholder="Digite seu nome"
                           >
                </div>
                <div class="input-group">
                    <label for="position">Position</label>
                    <input type="text"
                           id="position"
                           placeholder="Digite sua posição"
                           >
                </div>
                <div class="">
                    <a href="#" class="btn btn-next width-50 ml-auto">proximo</a>
                </div>
            </div>
            <div class="form-step ">
                <div class="input-group">
                    <label for="phone">Telefone</label>
                    <input type="text"
                           id="phone"
                           placeholder="Digite seu nome"
                           >
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email"
                           id="email"
                           placeholdere="Digite sua posição"
                           >
                </div>
                <div class="btns-group">
                    <a href="#" class="btn btn-prev">Voltar</a>
                    <a href="#" class="btn btn-next">proximo</a>
                </div>
            </div>
            <div class="form-step ">
                <div class="input-group">
                    <label for="date">Data de Nascimento</label>
                    <input type="date"
                           id="date"
                           >
                </div>
                <div class="input-group">
                    <label for="ID">ID</label>
                    <input type="number"
                           id="ID"
                           placeholdere="Digite sua posição"
                           >
                </div>
                <div class="btns-group">
                    <a href="#" class="btn btn-prev">Voltar</a>
                    <a href="#" class="btn btn-next">proximo</a>
                </div>
            </div>
            <div class="form-step ">
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password"
                           id="password"
                           >
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <input type="password"
                           id="confirmPassword"
                           placeholdere="Confirme sua Senha"
                           >
                </div>
                <div class="btns-group">
                    <a href="#" class="btn btn-prev">Voltar</a>
                    <input type="submit" value="submit" class="btn">
                </div>
            </div>
        </form>
    </body>
</html>
